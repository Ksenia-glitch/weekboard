<!doctype html>
<html lang="en" data-theme="moss">
  <head>
    <script>
      try {
        var theme = localStorage.getItem('cadence-week-theme-v1')
        var allowed = ['moss', 'ocean', 'ink', 'sunset', 'blossom', 'dusk']
        if (theme && allowed.indexOf(theme) !== -1) {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Weekboard — Weekly Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
